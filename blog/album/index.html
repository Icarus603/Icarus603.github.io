/a><a class="shot" href="/images/album/46-造化獨留功.webp" data-album="牡丹詩帖" data-caption="造化獨留功" data-date="2026年09月01日"><img src="/images/album/46-造化獨留功-thumb.webp" width="600" height="450" alt="造化獨留功" loading="lazy" decoding="async"></a><a class="shot" href="/images/album/47-舞蝶迷香徑.webp" data-album="牡丹詩帖" data-caption="舞蝶迷香徑" data-date="2026年09月01日"><img src="/images/album/47-舞蝶迷香徑-thumb.webp" width="600" height="450" alt="舞蝶迷香徑" loading="lazy" decoding="async"></a><a class="shot" href="/images/album/48-翩翩逐晚風.webp" data-album="牡丹詩帖" data-caption="翩翩逐晚風" data-date="2026年09月01日"><img src="/images/album/48-翩翩逐晚風-thumb.webp" width="600" height="450" alt="翩翩逐晚風" loading="lazy" decoding="async"></a></div><div id="lb" class="lb" role="dialog" aria-modal="true" aria-label="照片檢視" hidden><button type="button" class="lb-close" aria-label="關閉">×</button><button type="button" class="lb-prev" aria-label="上一張">‹</button><figure><img alt=""><figcaption></figcaption></figure><button type="button" class="lb-next" aria-label="下一張">›</button></div><script>
        (() => {
          const shots = [...document.querySelectorAll('.shot')];
          const lb = document.getElementById('lb');
          if (!shots.length || !lb) return;
          const img = lb.querySelector('img');
          const cap = lb.querySelector('figcaption');
          let list = shots, cur = 0;

          const visible = () => shots.filter((s) => !s.hidden);
          function show(i) {
            cur = (i + list.length) % list.length;
            const s = list[cur];
            img.src = s.href;
            img.alt = s.dataset.caption || '照片';
            const meta = [s.dataset.album, s.dataset.date].filter(Boolean).join(' · ');
            cap.textContent = [s.dataset.caption, meta].filter(Boolean).join('　');
            new Image().src = list[(cur + 1) % list.length].href; // 預載下一張
          }
          function open(s) {
            list = visible();
            lb.hidden = false;
            document.documentElement.style.overflow = 'hidden';
            show(list.indexOf(s));
            lb.querySelector('.lb-close').focus();
          }
          function close() {
            lb.hidden = true;
            img.removeAttribute('src');
            document.documentElement.style.overflow = '';
          }

          shots.forEach((s) => s.addEventListener('click', (e) => { e.preventDefault(); open(s); }));
          lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
          lb.querySelector('.lb-close').addEventListener('click', close);
          lb.querySelector('.lb-prev').addEventListener('click', () => show(cur - 1));
          lb.querySelector('.lb-next').addEventListener('click', () => show(cur + 1));
          document.addEventListener('keydown', (e) => {
            if (lb.hidden) return;
            if (e.key === 'Escape') close();
            if (e.key === 'ArrowLeft') show(cur - 1);
            if (e.key === 'ArrowRight') show(cur + 1);
          });
          // 觸控：左右滑動換張
          let x0 = null;
          lb.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
          lb.addEventListener('touchend', (e) => {
            if (x0 === null) return;
            const dx = e.changedTouches[0].clientX - x0;
            x0 = null;
            if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
          });

          // 依相簿篩選
          const buttons = [...document.querySelectorAll('.album-filter button')];
          buttons.forEach((b) => b.addEventListener('click', () => {
            buttons.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
            const f = b.dataset.filter;
            shots.forEach((s) => { s.hidden = !!f && s.dataset.album !== f; });
          }));
        })();
      </script><a class="to-top" href="#top" aria-label="返回頂部"><span aria-hidden="true">↑</span><span class="t">返回頂部</span></a></main><footer class="foot">© 2026 Zetfung Liu. All rights reserved.</footer></div></body></html>
