tocomplete="off" autofocus aria-label="搜尋文章"><p id="status" class="search-status" aria-live="polite"></p><ul id="results" class="search-results"></ul><script type="module">
    const input = document.getElementById('q');
    const status = document.getElementById('status');
    const list = document.getElementById('results');
    let pagefind;

    async function load() {
      if (pagefind) return pagefind;
      try {
        pagefind = await import('/pagefind/pagefind.js');
      } catch {
        status.textContent = '搜尋索引只在正式建置後才有：先執行 bun run build，再用 bun run preview 查看。';
        return null;
      }
      return pagefind;
    }

    let timer;
    async function run() {
      const q = input.value.trim();
      list.innerHTML = '';
      if (!q) { status.textContent = ''; return; }
      const pf = await load();
      if (!pf) return;
      status.textContent = '搜尋中…';
      const search = await pf.search(q);
      const items = await Promise.all(search.results.slice(0, 20).map((r) => r.data()));
      status.textContent = items.length ? `找到 ${search.results.length} 篇` : '沒有找到相關文章。';
      for (const d of items) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = d.url;
        a.textContent = d.meta?.title || d.url;
        const p = document.createElement('p');
        p.innerHTML = d.excerpt; // 摘要只含 <mark> 標示，來自本站自己的內容
        li.append(a, p);
        list.append(li);
      }
    }

    input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 200); });
    const q0 = new URLSearchParams(location.search).get('q');
    if (q0) { input.value = q0; run(); }
  </script><a class="to-top" href="#top" aria-label="返回頂部"><span aria-hidden="true">↑</span><span class="t">返回頂部</span></a></main><footer class="foot">© 2026 Zetfung Liu. All rights reserved.</footer></div></body></html>
